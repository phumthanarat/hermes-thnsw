# Hermes: two gateways (app/db and app2/db2, e.g. for loopback tests) plus
# test FTP/SFTP/mail servers. First run deploy/setup.sh, which writes .env
# with the database passwords; then "docker compose up -d".

x-db: &db
  image: h2o/db:2.0
  environment: &db-env
    MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?run deploy/setup.sh first}
    HERMES_DB_USER: ${HERMES_DB_USER:-hermes}
    HERMES_DB_PASSWORD: ${HERMES_DB_PASSWORD:?run deploy/setup.sh first}
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
    interval: 5s
    timeout: 5s
    retries: 60

# brings an existing database up to the current schema (runs, then exits)
x-db-upgrade: &db-upgrade
  image: h2o/db:2.0
  entrypoint: ["/usr/local/bin/hermes-upgrade.sh"]
  restart: "no"

# daily backups into deploy/backups (hermes-backup.sh)
x-backup: &backup
  image: h2o/db:2.0
  entrypoint: ["/usr/local/bin/hermes-backup.sh"]
  restart: unless-stopped

x-app: &app
  image: h2o/app:2.0
  privileged: true
  restart: unless-stopped

x-app-env: &app-env
  HERMES_DB_USER: ${HERMES_DB_USER:-hermes}
  HERMES_DB_PASSWORD: ${HERMES_DB_PASSWORD:?run deploy/setup.sh first}
  # HTTPS certificate: generated for APP_TLS_HOSTNAME on first start, then
  # replaceable from the admin console (Main > HTTPS Certificate) or with
  # PEM files named by APP_TLS_CERT_FILE / APP_TLS_KEY_FILE (mount them)
  APP_TLS_HOSTNAME: ${APP_TLS_HOSTNAME:-localhost}
  APP_TLS_CERT_FILE: ${APP_TLS_CERT_FILE:-}
  APP_TLS_KEY_FILE: ${APP_TLS_KEY_FILE:-}

services:
  db:
    <<: *db
    container_name: h2o_db
    build:
      context: ..
      dockerfile: deploy/db/Dockerfile
    volumes:
      - h2o_mysql_data:/var/lib/mysql

  db-upgrade:
    <<: *db-upgrade
    container_name: h2o_db_upgrade
    environment:
      <<: *db-env
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy

  backup:
    <<: *backup
    container_name: h2o_backup
    environment:
      <<: *db-env
      DB_HOST: db
      BACKUP_NAME: hermes-app
      BACKUP_TIME: ${BACKUP_TIME:-01:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_UID: ${BACKUP_UID:-}
      BACKUP_GID: ${BACKUP_GID:-}
    volumes:
      - ./backups:/backups
      - h2o_app_repository:/app-repository:ro
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    container_name: h2o_app
    build:
      context: ..
      dockerfile: deploy/app_server/Dockerfile
    depends_on:
      db-upgrade:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      HERMES_DB_HOST: db
      APP_HTTP_PORT: ${APP_HTTP_PORT:-8080}
      APP_HTTPS_PORT: ${APP_HTTPS_PORT:-8443}
      # first start: administrator admin/admin, to be changed at first login;
      # APP_ADMIN_RESET=true resets it on each start while set: use it for one
      # start, then remove it (see app_server/admin-credentials.sh)
      APP_ADMIN_USER: ${APP_ADMIN_USER:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ADMIN_RESET: ${APP_ADMIN_RESET:-false}
      # admin console over HTTPS only, redirected to the host's HTTPS port
      APP_ADMIN_REQUIRE_HTTPS: ${APP_ADMIN_REQUIRE_HTTPS:-true}
      APP_ADMIN_HTTPS_PORT: ${APP_HOST_HTTPS_PORT:-18443}
      APP_API_USER: ${APP_API_USER:-apiuser}
      APP_API_PASSWORD: ${APP_API_PASSWORD:-}
    expose:
      - "${APP_HTTP_PORT:-8080}"
      - "${APP_HTTPS_PORT:-8443}"
    ports:
      - "${APP_HOST_HTTP_PORT:-18080}:${APP_HTTP_PORT:-8080}"
      - "${APP_HOST_HTTPS_PORT:-18443}:${APP_HTTPS_PORT:-8443}"
    volumes:
      - h2o_app_logs:/hermes_home/logs
      - h2o_app_repository:/hermes_home/repository

  db2:
    <<: *db
    container_name: h2o_db2
    volumes:
      - h2o_mysql2_data:/var/lib/mysql

  db2-upgrade:
    <<: *db-upgrade
    container_name: h2o_db2_upgrade
    environment:
      <<: *db-env
      DB_HOST: db2
    depends_on:
      db2:
        condition: service_healthy

  backup2:
    <<: *backup
    container_name: h2o_backup2
    environment:
      <<: *db-env
      DB_HOST: db2
      BACKUP_NAME: hermes-app2
      BACKUP_TIME: ${BACKUP_TIME:-01:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_UID: ${BACKUP_UID:-}
      BACKUP_GID: ${BACKUP_GID:-}
    volumes:
      - ./backups:/backups
      - h2o_app2_repository:/app-repository:ro
    depends_on:
      db2:
        condition: service_healthy

  app2:
    <<: *app
    container_name: h2o_app2
    depends_on:
      db2-upgrade:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      HERMES_DB_HOST: db2
      APP_HTTP_PORT: ${APP2_HTTP_PORT:-8080}
      APP_HTTPS_PORT: ${APP2_HTTPS_PORT:-8443}
      APP_ADMIN_USER: ${APP2_ADMIN_USER:-admin}
      APP_ADMIN_PASSWORD: ${APP2_ADMIN_PASSWORD:-}
      APP_ADMIN_RESET: ${APP2_ADMIN_RESET:-false}
      APP_ADMIN_REQUIRE_HTTPS: ${APP2_ADMIN_REQUIRE_HTTPS:-true}
      APP_ADMIN_HTTPS_PORT: ${APP2_HOST_HTTPS_PORT:-28443}
      APP_API_USER: ${APP2_API_USER:-apiuser}
      APP_API_PASSWORD: ${APP2_API_PASSWORD:-}
    expose:
      - "${APP2_HTTP_PORT:-8080}"
      - "${APP2_HTTPS_PORT:-8443}"
    ports:
      - "${APP2_HOST_HTTP_PORT:-28080}:${APP2_HTTP_PORT:-8080}"
      - "${APP2_HOST_HTTPS_PORT:-28443}:${APP2_HTTPS_PORT:-8443}"
    volumes:
      - h2o_app2_logs:/hermes_home/logs
      - h2o_app2_repository:/hermes_home/repository

  testftp:
    container_name: h2o_testftp
    image: stilliard/pure-ftpd:hardened
    environment:
      PUBLICHOST: testftp
      FTP_USER_NAME: testuser
      FTP_USER_PASS: testpass
      FTP_USER_HOME: /home/testuser
      ADDED_FLAGS: "--tls=0"
    expose:
      - 21
      - "30000-30009"
    volumes:
      - h2o_testftp_data:/home/testuser

  testftps:
    container_name: h2o_testftps
    image: stilliard/pure-ftpd:hardened
    environment:
      PUBLICHOST: testftps
      FTP_USER_NAME: testuser
      FTP_USER_PASS: testpass
      FTP_USER_HOME: /home/testuser
      TLS_CN: testftps
      TLS_ORG: Hermes2plus Test
      TLS_C: HK
      ADDED_FLAGS: "--tls=1"
    expose:
      - 21
      - "30010-30019"
    volumes:
      - h2o_testftps_data:/home/testuser

  testsftp:
    container_name: h2o_testsftp
    image: atmoz/sftp
    command: testuser:testpass:::upload
    expose:
      - 22
    volumes:
      - h2o_testsftp_data:/home/testuser

  testmail:
    container_name: h2o_testmail
    image: greenmail/standalone:2.0.1
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=testuser:testpass@testmail.local -Dgreenmail.auth.disabled"
    expose:
      - 3110
      - 3143
      - 3025

volumes:
  # MySQL 8.4 data (the old 5.7 volumes h2o_db_data / h2o_db2_data are no
  # longer used; move their data with tools/migrate-from-mysql57.sh)
  h2o_mysql_data:
  h2o_mysql2_data:
  h2o_app_logs:
  h2o_app_repository:
  h2o_app2_logs:
  h2o_app2_repository:
  h2o_testftp_data:
  h2o_testftps_data:
  h2o_testsftp_data:
