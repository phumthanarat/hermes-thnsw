version: "2"
services:
  db:
    container_name: h2o_db
    image: h2o/db:1.0
    build:
      context: ..
      dockerfile: deploy/db/Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: h2o_db_password
    volumes:
      - h2o_db_data:/var/lib/mysql
  app:
    container_name: h2o_app
    image: h2o/app:1.0
    build:
      context: ..
      dockerfile: deploy/app_server/Dockerfile
    privileged: true
    links:
      - db
    environment:
      APP_HTTP_PORT: ${APP_HTTP_PORT:-8080}
      APP_HTTPS_PORT: ${APP_HTTPS_PORT:-8443}
      # first start: administrator admin/admin, to be changed at first login;
      # APP_ADMIN_RESET=true resets it on each start while set: use it for one
      # start, then remove it (see app_server/admin-credentials.sh)
      APP_ADMIN_USER: ${APP_ADMIN_USER:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_ADMIN_RESET: ${APP_ADMIN_RESET:-false}
      # admin console over HTTPS only, redirected to the host's HTTPS port
      APP_ADMIN_REQUIRE_HTTPS: ${APP_ADMIN_REQUIRE_HTTPS:-true}
      APP_ADMIN_HTTPS_PORT: ${APP_HOST_HTTPS_PORT:-18443}
      APP_API_USER: ${APP_API_USER:-apiuser}
      APP_API_PASSWORD: ${APP_API_PASSWORD:-}
    expose:
      - "${APP_HTTP_PORT:-8080}"
      - "${APP_HTTPS_PORT:-8443}"
    ports:
      - "${APP_HOST_HTTP_PORT:-18080}:${APP_HTTP_PORT:-8080}"
      - "${APP_HOST_HTTPS_PORT:-18443}:${APP_HTTPS_PORT:-8443}"
    volumes:
      - h2o_app_logs:/hermes_home/logs
      - h2o_app_repository:/hermes_home/repository

  db2:
    container_name: h2o_db2
    image: h2o/db:1.0
    environment:
      MYSQL_ROOT_PASSWORD: h2o_db_password
    volumes:
      - h2o_db2_data:/var/lib/mysql

  app2:
    container_name: h2o_app2
    image: h2o/app:1.0
    privileged: true
    links:
      - db2:db
    environment:
      APP_HTTP_PORT: ${APP2_HTTP_PORT:-8080}
      APP_HTTPS_PORT: ${APP2_HTTPS_PORT:-8443}
      APP_ADMIN_USER: ${APP2_ADMIN_USER:-admin}
      APP_ADMIN_PASSWORD: ${APP2_ADMIN_PASSWORD:-}
      APP_ADMIN_RESET: ${APP2_ADMIN_RESET:-false}
      APP_ADMIN_REQUIRE_HTTPS: ${APP2_ADMIN_REQUIRE_HTTPS:-true}
      APP_ADMIN_HTTPS_PORT: ${APP2_HOST_HTTPS_PORT:-28443}
      APP_API_USER: ${APP2_API_USER:-apiuser}
      APP_API_PASSWORD: ${APP2_API_PASSWORD:-}
    expose:
      - "${APP2_HTTP_PORT:-8080}"
      - "${APP2_HTTPS_PORT:-8443}"
    ports:
      - "${APP2_HOST_HTTP_PORT:-28080}:${APP2_HTTP_PORT:-8080}"
      - "${APP2_HOST_HTTPS_PORT:-28443}:${APP2_HTTPS_PORT:-8443}"
    volumes:
      - h2o_app2_logs:/hermes_home/logs
      - h2o_app2_repository:/hermes_home/repository

  testftp:
    container_name: h2o_testftp
    image: stilliard/pure-ftpd:hardened
    environment:
      PUBLICHOST: testftp
      FTP_USER_NAME: testuser
      FTP_USER_PASS: testpass
      FTP_USER_HOME: /home/testuser
      ADDED_FLAGS: "--tls=0"
    expose:
      - 21
      - "30000-30009"
    volumes:
      - h2o_testftp_data:/home/testuser

  testftps:
    container_name: h2o_testftps
    image: stilliard/pure-ftpd:hardened
    environment:
      PUBLICHOST: testftps
      FTP_USER_NAME: testuser
      FTP_USER_PASS: testpass
      FTP_USER_HOME: /home/testuser
      TLS_CN: testftps
      TLS_ORG: Hermes2plus Test
      TLS_C: HK
      ADDED_FLAGS: "--tls=1"
    expose:
      - 21
      - "30010-30019"
    volumes:
      - h2o_testftps_data:/home/testuser

  testsftp:
    container_name: h2o_testsftp
    image: atmoz/sftp
    command: testuser:testpass:::upload
    expose:
      - 22
    volumes:
      - h2o_testsftp_data:/home/testuser

  testmail:
    container_name: h2o_testmail
    image: greenmail/standalone:2.0.1
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=testuser:testpass@testmail.local -Dgreenmail.auth.disabled"
    expose:
      - 3110
      - 3143
      - 3025

volumes:
  h2o_db_data:
  h2o_app_logs:
  h2o_app_repository:
  h2o_db2_data:
  h2o_app2_logs:
  h2o_app2_repository:
  h2o_testftp_data:
  h2o_testftps_data:
  h2o_testsftp_data:
